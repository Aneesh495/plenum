name: Plenum CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify No Em Dashes
        run: python3 scripts/check_no_em_dashes.py

      - name: Cargo Test
        run: cargo test --verbose

      - name: Plenum Self-Test Suite
        run: cargo run -- --test

      - name: Benchmark Throughput
        run: cargo run -- --benchmark
